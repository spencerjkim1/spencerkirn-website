name: AppSec scheduled traffic every 5 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
permissions:
  contents: read

concurrency:
  group: appsec-diverse-synthetic-traffic
  cancel-in-progress: false

jobs:
  generate-traffic:
    strategy:
      fail-fast: false
      matrix:
        profile: [browser, api, bot, attack]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_ORIGIN: https://spencerkirn.com
      PROFILE: ${{ matrix.profile }}
      VOLUME: ${{ inputs.requests_per_profile || 30 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate labeled traffic for ${{ matrix.profile }} profile
        run: node scripts/appsec-traffic-generator-v2.mjs
