<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spencer Kim</title>
    <link rel="icon" href="/assets/favicon.ico?v=2" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=2" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" sizes="180x180">
    <meta name="description" content="Music, films, and experiments by Spencer Kim.">
    <script src="/assets/site.js" defer></script>
    <script type="module" src="/assets/tree.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 700;
            background: #fff;
            color: #000;
            line-height: 1.4;
        }
        
        /* Name Header */
        .name {
            padding: 120px 40px 80px 40px;
            border-bottom: 3px solid #000;
        }
        
        .name h1 {
            font-size: 8rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        /* Section Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }
        
        /* Section Styling */
        section {
            padding: 100px 0;
            border-bottom: 1px solid #000;
        }
        
        section:last-child {
            border-bottom: none;
        }
        
        section h2 {
            font-size: 4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            margin-bottom: 60px;
        }
        
        /* Content Area */
        .content {
            background: #f5f5f5;
            padding: 80px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .placeholder {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
        }
        
        /* Footer */
        footer {
            padding: 60px 40px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .name h1 {
                font-size: 5rem;
            }
            
            section h2 {
                font-size: 3rem;
            }
            
            .content {
                padding: 60px 40px;
            }
        }
        
        @media (max-width: 768px) {
            .name {
                padding: 80px 20px 40px 20px;
            }
            
            .name h1 {
                font-size: 3.5rem;
            }
            
            .container {
                padding: 0 20px;
            }
            
            section {
                padding: 60px 0;
            }
            
            section h2 {
                font-size: 2.5rem;
                margin-bottom: 40px;
            }
            
            .content {
                padding: 40px 30px;
                min-height: 300px;
            }
            
            .placeholder {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .name h1 {
                font-size: 2.5rem;
            }
            
            section h2 {
                font-size: 2rem;
            }
            
            .content {
                padding: 30px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
    <!-- Name -->
    <div class="name tree-header">
        <div class="tree-art" aria-hidden="true">
            <img class="tree-art__still" src="/assets/tree-cutout.png" width="480" height="480" alt="" fetchpriority="high">
            <canvas class="tree-art__canvas" hidden></canvas>
        </div>
        <h1>SPENCER KIM</h1>
    </div>

    <nav class="site-nav" aria-label="Explore the site">
        <a href="#spotify">Spotify <span>01</span></a>
        <a href="#letterboxd">Letterboxd <span>02</span></a>
        <a href="#demo">Demos <span>03</span></a>
    </nav>

    <main>
    <div class="container">
        <!-- Spotify Section -->
        <section id="spotify">
            <h2>SPOTIFY</h2>
            <article class="listening-block" aria-labelledby="currently-playing-heading">
                <div class="playlist-heading"><h3 id="currently-playing-heading">Currently playing</h3><span id="playback-state" class="playback-state" hidden></span></div>
                <p class="playlist-note" id="currently-playing-status" role="status">Loading Spotify…</p>
                <a id="current-track" class="current-track" target="_blank" rel="noopener noreferrer" hidden>
                    <img id="current-art" width="96" height="96" alt="" hidden>
                    <span><strong id="current-name"></strong><span id="current-artist" class="track-artist"></span><span class="track-source">Listen on Spotify ↗</span></span>
                </a>
            </article>
            <article class="listening-block" aria-labelledby="recently-played-heading">
                <div class="playlist-heading"><h3 id="recently-played-heading">Recently played</h3><label class="history-limit" for="history-limit">Show <select id="history-limit"><option value="20" selected>20 songs</option><option value="50">50 songs</option><option value="100">100 songs</option></select></label></div>
                <p class="playlist-note" id="recently-played-status" role="status">Loading listening history…</p>
                <div class="history-widget" id="history-widget" role="region" aria-labelledby="recently-played-heading" aria-describedby="recently-played-status" tabindex="0" hidden>
                    <ol id="recently-played-tracks" class="track-list"></ol>
                </div>
            </article>
            <div class="playlist">
                <div class="content">
                    <iframe title="On Repeat playlist on Spotify" data-testid="embed-iframe" style="border-radius:0" src="https://open.spotify.com/embed/playlist/37i9dQZF1EppctzT1uUNeh?utm_source=generator&si=91da0a2a12354925" width="100%" height="400" frameBorder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
            <p class="profile-link"><a class="text-link" href="https://open.spotify.com/user/31wib43cvruufuubomgqj5v5h4t4" target="_blank" rel="noopener noreferrer">Spotify</a></p>
        </section>

        <!-- Letterboxd Section -->
        <section id="letterboxd">
            <h2>LETTERBOXD</h2>
            <div class="playlist-heading"><h3>Recently watched</h3></div>
            <p class="playlist-note" id="films-status" role="status">Loading recent films…</p>
            <div class="film-grid" id="recent-films"></div>
            <p class="profile-link"><a class="text-link" href="https://letterboxd.com/spencerjkim/" target="_blank" rel="noopener noreferrer">Letterboxd</a></p>
        </section>
        <section id="demo">
            <h2>DEMOS</h2>
            <div class="content">
                <a href="/demo"
                   style="color: #000; text-decoration: none; font-size: 2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;">
                   VIEW DEMOS →
                </a>
            </div>
        </section>
    </div>
    </main>

    <!-- Footer -->
    <footer>
        <a href="#" aria-label="Back to top">↑</a>
    </footer>
</body>
</html>
